<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace' fill="none" stroke="#8FD3F4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<title id="t">Pipeline from data to firmware</title>
<desc id="d">Six numbered cells in a row: data, split, train, evaluate, quantise and firmware, each with a small line icon and a short caption.</desc>
<rect x="0.75" y="0.75" width="878.5" height="328.5" rx="6" fill="#0B1A2E"/>
<text x="28" y="34" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="start" letter-spacing="0.72">FIG. 1 · THE PIPELINE</text>
<text x="28" y="64" font-size="20" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">From video to firmware</text>
<rect x="28" y="92" width="824" height="210" rx="6" fill="#0B1A2E" stroke="#EAF2FB"/>
<text x="42.0" y="120" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="start">01</text>
<g transform="translate(42.0 132)" stroke="#8FD3F4"><rect x="6" y="12" width="36" height="24" rx="3"/><path d="M6 18H42M6 30H42M12 12V18M18 12V18M24 12V18M30 12V18M36 12V18M12 30V36M18 30V36M24 30V36M30 30V36M36 30V36"/><rect x="19" y="20" width="10" height="8" fill="#FFD200" stroke="none"/></g>
<text x="42.0" y="210" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Data</text>
<text x="42.0" y="234" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">Labelled video</text>
<text x="42.0" y="251" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">clips; boxes</text>
<text x="42.0" y="268" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">become crops</text>
<path d="M165.3 92V302" stroke="#2B4A70" stroke-width="1"/>
<text x="179.33333333333334" y="120" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="start">02</text>
<g transform="translate(179.3 132)" stroke="#8FD3F4"><circle cx="24" cy="8" r="4"/><path d="M24 12V20M24 20L10 32M24 20V32M24 20L38 32"/><rect x="5" y="32" width="10" height="10" rx="2"/><rect x="19" y="32" width="10" height="10" rx="2"/><rect x="33" y="32" width="10" height="10" rx="2" fill="#FFD200"/></g>
<text x="179.33333333333334" y="210" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Split</text>
<text x="179.33333333333334" y="234" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">Whole scenes go</text>
<text x="179.33333333333334" y="251" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">to train, val,</text>
<text x="179.33333333333334" y="268" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">or test</text>
<path d="M302.7 92V302" stroke="#2B4A70" stroke-width="1"/>
<text x="316.6666666666667" y="120" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="start">03</text>
<g transform="translate(316.7 132)" stroke="#8FD3F4"><path d="M10 14L24 10M10 14L24 24M10 14L24 38M10 34L24 10M10 34L24 24M10 34L24 38M24 10L38 24M24 24L38 24M24 38L38 24"/><circle cx="10" cy="14" r="3.5" fill="#0B1A2E"/><circle cx="10" cy="34" r="3.5" fill="#0B1A2E"/><circle cx="24" cy="10" r="3.5" fill="#0B1A2E"/><circle cx="24" cy="24" r="3.5" fill="#0B1A2E"/><circle cx="24" cy="38" r="3.5" fill="#0B1A2E"/><circle cx="38" cy="24" r="3.5" fill="#FFD200"/></g>
<text x="316.6666666666667" y="210" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Train</text>
<text x="316.6666666666667" y="234" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">Small network,</text>
<text x="316.6666666666667" y="251" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">fine-tuned on</text>
<text x="316.6666666666667" y="268" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">a laptop CPU</text>
<path d="M440.0 92V302" stroke="#2B4A70" stroke-width="1"/>
<text x="454.0" y="120" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="start">04</text>
<g transform="translate(454.0 132)" stroke="#8FD3F4"><rect x="8" y="8" width="32" height="32" rx="2"/><path d="M8 18.7H40M8 29.3H40M18.7 8V40M29.3 8V40"/><rect x="10" y="10" width="7" height="7" fill="#FFD200" stroke="none"/><rect x="20.7" y="20.7" width="7" height="7" fill="#FFD200" stroke="none"/><rect x="31.3" y="31.3" width="7" height="7" fill="#FFD200" stroke="none"/></g>
<text x="454.0" y="210" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Evaluate</text>
<text x="454.0" y="234" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">Test split only</text>
<text x="454.0" y="251" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">intervals by</text>
<text x="454.0" y="268" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">video</text>
<path d="M577.3 92V302" stroke="#2B4A70" stroke-width="1"/>
<text x="591.3333333333334" y="120" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="start">05</text>
<g transform="translate(591.3 132)" stroke="#8FD3F4"><rect x="5" y="7" width="22" height="22" rx="2"/><path d="M5 14H27M5 21H27M12 7V29M19 7V29M28 30L34 34M34 34V29M34 34H29"/><rect x="34" y="34" width="10" height="10" rx="1.5" fill="#FFD200"/></g>
<text x="591.3333333333334" y="210" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Quantise</text>
<text x="591.3333333333334" y="234" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">ONNX, then int8</text>
<text x="591.3333333333334" y="251" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">size and</text>
<text x="591.3333333333334" y="268" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">accuracy</text>
<path d="M714.7 92V302" stroke="#2B4A70" stroke-width="1"/>
<text x="728.6666666666667" y="120" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="start">06</text>
<g transform="translate(728.7 132)" stroke="#8FD3F4"><rect x="13" y="13" width="22" height="22" rx="3"/><rect x="19" y="19" width="10" height="10" rx="1" fill="#FFD200"/><path d="M18 13V7M24 13V7M30 13V7M18 35V41M24 35V41M30 35V41M13 18H7M13 24H7M13 30H7M35 18H41M35 24H41M35 30H41"/></g>
<text x="728.6666666666667" y="210" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Firmware</text>
<text x="728.6666666666667" y="234" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">C++ state logic</text>
<text x="728.6666666666667" y="251" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">tested on a</text>
<text x="728.6666666666667" y="268" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">laptop</text>
</svg>
