<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 470" width="868" height="470" role="img" aria-labelledby="t d" font-family='ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace'>
<title id="t">Why the split is by scene</title>
<desc id="d">Left panel: a random frame split puts frames from one scene into train, validation and test, so the test set leaks. Right panel: whole scenes are assigned to one split each.</desc>
<rect x="0" y="0" width="868" height="470" rx="28" fill="#1F1B26"/>
<text x="32" y="46" font-size="20" font-weight="bold" fill="#F1EEF5" text-anchor="start">Split by scene, not by frame</text>
<rect x="32" y="72" width="384" height="340" rx="22" fill="#4A3F1E"/>
<text x="56" y="106" font-size="15" font-weight="bold" fill="#F1EEF5" text-anchor="start">Random frame split: leaks</text>
<rect x="452" y="72" width="384" height="340" rx="22" fill="#25423A"/>
<text x="476" y="106" font-size="15" font-weight="bold" fill="#F1EEF5" text-anchor="start">Split by scene: no leak</text>
<rect x="50" y="128" width="150" height="132" rx="22" fill="#292433"/>
<text x="66" y="152" font-size="13" font-weight="normal" fill="#BDB5C9" text-anchor="start">scene A</text>
<circle cx="74" cy="184" r="12" fill="#B7A0F0"/>
<text x="74" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="110" cy="184" r="12" fill="#F5C766"/>
<text x="110" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">te</text>
<circle cx="146" cy="184" r="12" fill="#6FCFA0"/>
<text x="146" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="74" cy="222" r="12" fill="#6FCFA0"/>
<text x="74" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="110" cy="222" r="12" fill="#B7A0F0"/>
<text x="110" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="146" cy="222" r="12" fill="#F5C766"/>
<text x="146" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">te</text>
<rect x="240" y="128" width="150" height="132" rx="22" fill="#292433"/>
<text x="256" y="152" font-size="13" font-weight="normal" fill="#BDB5C9" text-anchor="start">scene B</text>
<circle cx="264" cy="184" r="12" fill="#B7A0F0"/>
<text x="264" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="300" cy="184" r="12" fill="#F5C766"/>
<text x="300" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">te</text>
<circle cx="336" cy="184" r="12" fill="#6FCFA0"/>
<text x="336" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="264" cy="222" r="12" fill="#6FCFA0"/>
<text x="264" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="300" cy="222" r="12" fill="#B7A0F0"/>
<text x="300" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="336" cy="222" r="12" fill="#F5C766"/>
<text x="336" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">te</text>
<text x="56" y="292" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">Near-identical frames sit</text>
<text x="56" y="312" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">in train and in test.</text>
<text x="56" y="346" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">The test score looks better</text>
<text x="56" y="366" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">than it should.</text>
<rect x="470" y="128" width="150" height="132" rx="22" fill="#292433"/>
<text x="486" y="152" font-size="13" font-weight="normal" fill="#BDB5C9" text-anchor="start">scene A</text>
<circle cx="494" cy="184" r="12" fill="#B7A0F0"/>
<text x="494" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="530" cy="184" r="12" fill="#B7A0F0"/>
<text x="530" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="566" cy="184" r="12" fill="#B7A0F0"/>
<text x="566" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="494" cy="222" r="12" fill="#B7A0F0"/>
<text x="494" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="530" cy="222" r="12" fill="#B7A0F0"/>
<text x="530" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<circle cx="566" cy="222" r="12" fill="#B7A0F0"/>
<text x="566" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">tr</text>
<rect x="660" y="128" width="150" height="132" rx="22" fill="#292433"/>
<text x="676" y="152" font-size="13" font-weight="normal" fill="#BDB5C9" text-anchor="start">scene B</text>
<circle cx="684" cy="184" r="12" fill="#6FCFA0"/>
<text x="684" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="720" cy="184" r="12" fill="#6FCFA0"/>
<text x="720" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="756" cy="184" r="12" fill="#6FCFA0"/>
<text x="756" y="188" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="684" cy="222" r="12" fill="#6FCFA0"/>
<text x="684" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="720" cy="222" r="12" fill="#6FCFA0"/>
<text x="720" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<circle cx="756" cy="222" r="12" fill="#6FCFA0"/>
<text x="756" y="226" font-size="12" font-weight="bold" fill="#1F1B26" text-anchor="middle">va</text>
<text x="476" y="292" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">Whole scenes go to one split.</text>
<text x="476" y="312" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">Scenes are grouped by</text>
<text x="476" y="332" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">perceptual hash.</text>
<text x="476" y="366" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">Limit: it finds near-identical</text>
<text x="476" y="386" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">scenes only.</text>
<circle cx="44" cy="442" r="10" fill="#B7A0F0"/>
<text x="62" y="447" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">tr = train</text>
<circle cx="194" cy="442" r="10" fill="#6FCFA0"/>
<text x="212" y="447" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">va = val</text>
<circle cx="344" cy="442" r="10" fill="#F5C766"/>
<text x="362" y="447" font-size="13" font-weight="normal" fill="#F1EEF5" text-anchor="start">te = test</text>
</svg>
