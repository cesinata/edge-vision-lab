<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace' fill="none" stroke="#8FD3F4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<title id="t">Generic vision board data path</title>
<desc id="d">A camera feeds a microcontroller in the middle, which exchanges tensors with an optional accelerator, reads and writes memory, and sends results out over a host link. A strip says nothing here is measured on hardware.</desc>
<rect x="0.75" y="0.75" width="878.5" height="398.5" rx="6" fill="#0B1A2E"/>
<text x="28" y="34" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="start" letter-spacing="0.72">FIG. 4 · A GENERIC VISION BOARD</text>
<text x="28" y="64" font-size="20" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Where the data goes</text>
<rect x="28" y="92" width="210" height="80" rx="6" fill="#0B1A2E" stroke="#EAF2FB"/>
<text x="42" y="122" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Camera</text>
<text x="42" y="142" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">sends frames</text>
<rect x="28" y="224" width="210" height="80" rx="6" fill="#FFD200" stroke="#EAF2FB"/>
<text x="42" y="254" font-size="14" font-weight="600" fill="#03234B" stroke="none" text-anchor="start">Accelerator</text>
<text x="42" y="274" font-size="12" font-weight="400" fill="#03234B" stroke="none" text-anchor="start">optional, runs the model</text>
<rect x="335" y="92" width="210" height="212" rx="6" fill="#0B1A2E" stroke="#EAF2FB"/>
<text x="349" y="122" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Microcontroller</text>
<text x="349" y="142" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">runs the logic</text>
<rect x="395" y="168" width="90" height="90" rx="4" fill="#0B1A2E"/><rect x="415" y="188" width="50" height="50" rx="3" fill="#FFD200"/><path d="M410 168V158M430 168V158M450 168V158M470 168V158M410 258V268M430 258V268M450 258V268M470 258V268M395 190H385M395 210H385M395 230H385M485 190H495M485 210H495M485 230H495"/>
<rect x="642" y="92" width="210" height="80" rx="6" fill="#0B1A2E" stroke="#EAF2FB"/>
<text x="656" y="122" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Host link</text>
<text x="656" y="142" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">results out</text>
<rect x="642" y="224" width="210" height="80" rx="6" fill="#0B1A2E" stroke="#EAF2FB"/>
<text x="656" y="254" font-size="14" font-weight="600" fill="#EAF2FB" stroke="none" text-anchor="start">Memory</text>
<text x="656" y="274" font-size="12" font-weight="400" fill="#C9D8EA" stroke="none" text-anchor="start">weights, buffers</text>
<path d="M238 132H335"/><circle cx="238" cy="132" r="3.5" fill="#8FD3F4"/><circle cx="335" cy="132" r="3.5" fill="#8FD3F4"/>
<text x="286.5" y="122" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="middle">frame</text>
<path d="M545 132H642"/><circle cx="545" cy="132" r="3.5" fill="#8FD3F4"/><circle cx="642" cy="132" r="3.5" fill="#8FD3F4"/>
<text x="593.5" y="122" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="middle">results</text>
<path d="M238 264H335"/><circle cx="238" cy="264" r="3.5" fill="#8FD3F4"/><circle cx="335" cy="264" r="3.5" fill="#8FD3F4"/>
<text x="286.5" y="254" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="middle">tensors</text>
<path d="M545 264H642"/><circle cx="545" cy="264" r="3.5" fill="#8FD3F4"/><circle cx="642" cy="264" r="3.5" fill="#8FD3F4"/>
<text x="593.5" y="254" font-size="12" font-weight="500" fill="#A8BCD6" stroke="none" text-anchor="middle">read, write</text>
<rect x="28" y="330" width="824" height="50" rx="6" fill="#10243F" stroke="#EAF2FB"/>
<circle cx="52" cy="355" r="6" fill="#FFD200"/>
<text x="70" y="360" font-size="12" font-weight="500" fill="#EAF2FB" stroke="none" text-anchor="start">not measured on hardware: no board was used, so this shows no speed, power or memory size</text>
